<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 100" width="420" height="100" fill="none">
  <defs>
    <linearGradient id="logoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF9E44"/>
      <stop offset="50%" stop-color="#FF6500"/>
      <stop offset="100%" stop-color="#E04800"/>
    </linearGradient>
    <linearGradient id="boxBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#142A49"/>
      <stop offset="100%" stop-color="#08101C"/>
    </linearGradient>
    <linearGradient id="cyanAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38E1FF"/>
      <stop offset="100%" stop-color="#00A3FF"/>
    </linearGradient>
    <filter id="logoShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#FF6500" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Left Icon Emblem (84x84) -->
  <g transform="translate(8, 8)">
    <rect width="84" height="84" rx="22" fill="url(#boxBg)" stroke="rgba(255,255,255,0.12)" stroke-width="1.5"/>
    <!-- Radar ring -->
    <circle cx="42" cy="42" r="32" stroke="#2C538A" stroke-width="1" stroke-dasharray="3 3" opacity="0.4"/>

    <!-- 'H' Form -->
    <rect x="23" y="24" width="8" height="36" rx="4" fill="#FFFFFF"/>
    <path d="M27 38 L54 38 C56 38 58 40 58 42 C58 44 56 46 54 46 L27 46 Z" fill="#FFFFFF"/>
    <rect x="52" y="24" width="8" height="24" rx="4" fill="#FFFFFF"/>

    <!-- Dynamic Orange Checkmark -->
    <g filter="url(#logoShadow)">
      <circle cx="63" cy="23" r="3" fill="url(#cyanAccent)"/>
      <path d="M37 44 L46 53 L64 33" stroke="url(#logoGrad)" stroke-width="7.5" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
  </g>

  <!-- Right Typography (Corporate & Modern) -->
  <g transform="translate(108, 22)">
    <!-- Wordmark HSM -->
    <text x="0" y="32" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-size="34" font-weight="900" letter-spacing="-0.5" fill="#FFFFFF">
      HSM<tspan fill="#FF6500">.</tspan>
    </text>
    <rect x="88" y="14" width="2" height="18" fill="rgba(255,255,255,0.18)"/>
    <text x="98" y="22" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-size="12" font-weight="800" letter-spacing="1.5" fill="#FF8800">
      FREELANCE
    </text>
    <text x="98" y="34" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-size="10" font-weight="600" letter-spacing="0.5" fill="#94A3B8">
      PERFORMANCE MONITORING
    </text>

    <!-- Subtitle baseline -->
    <text x="0" y="58" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="600" letter-spacing="2" fill="#64748B">
      GPS TRACKING &bull; SLA &bull; KPI ENGINE
    </text>
  </g>
</svg>
